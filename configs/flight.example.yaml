version: 1

http:
  address: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  management_max_body_bytes: 1048576

ingestion:
  grpc_address: ":4317"
  http_address: ":4318"
  # Phase 2 trusts a statically configured Collector identity. API-key mapping is Phase 4.
  project_id: "01900000-0000-7000-8000-000000000001"
  project_slug: "default"
  project_name: "Default Project"
  environment_id: "01900000-0000-7000-8000-000000000002"
  environment_name: "development"
  max_request_bytes: 4194304
  max_records_per_request: 10000
  max_attributes_per_record: 128
  max_attribute_value_bytes: 4096
  max_attribute_depth: 4
  queue_size: 4096
  queue_max_bytes: 67108864
  enqueue_timeout: 250ms
  batch_size: 256
  batch_timeout: 5s
  flush_interval: 200ms
  workers: 2
  redacted_keys: []

database:
  # Prefer FLIGHT_DATABASE_URL or a mounted secret in production.
  url: "postgres://flight:flight-dev-only@localhost:5432/flight?sslmode=disable"
  max_connections: 20
  min_connections: 2
  max_connection_lifetime: 1h
  max_connection_idle_time: 30m
  health_check_period: 1m
  readiness_timeout: 2s
  migrations_path: "./migrations"

shutdown_timeout: 15s
log_level: info
