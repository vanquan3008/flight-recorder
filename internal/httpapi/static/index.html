<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><h1>Flight</h1><p>Trace and log explorer</p></header>
  <main>
    <section class="key"><label>API key <input id="api-key" type="password" autocomplete="off"></label><button id="save-key">Use key</button><span id="key-status"></span></section>
    <nav><button data-view="traces">Traces</button><button data-view="logs">Logs</button><button data-view="services">Services</button><button data-view="incidents">Incidents</button></nav>
    <section id="filters"></section>
    <p id="status" role="status"></p>
    <section id="results"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
