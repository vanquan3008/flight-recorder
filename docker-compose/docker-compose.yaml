
name: tracepilot

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: tracepilot-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    init: true

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracepilot}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracepilot}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null 2>&1'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    stop_grace_period: 60s

    networks:
      - backend

  # ============================================================================
  # CLICKHOUSE WEB UI
  # ============================================================================
  clickhouse-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: tracepilot-clickhouse-ui
    hostname: clickhouse-ui
    restart: unless-stopped
    init: true

    depends_on:
      clickhouse:
        condition: service_healthy

    environment:
      PORT: "3488"
      APP_URL: http://localhost:3488
      APP_SECRET_KEY: ${CH_UI_SECRET_KEY:?CH_UI_SECRET_KEY is required}
      DATABASE_PATH: /app/data/ch-ui.db
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: "TracePilot ClickHouse"
      ALLOWED_ORIGINS: http://localhost:3488
      ALLOW_LOGIN_URL: "false"
      SESSION_MAX_AGE: "604800"

    ports:
      - "127.0.0.1:3488:3488"

    volumes:
      - clickhouse_ui_data:/app/data

    networks:
      - backend

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  clickhouse_data:
    driver: local

  clickhouse_logs:
    driver: local

  clickhouse_ui_data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  backend:
    driver: bridge
