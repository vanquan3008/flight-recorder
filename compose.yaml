name: tracepilot

# One runtime configuration source: repository-root .env.
x-application: &application
  build: ./backend
  image: ${TRACEPILOT_IMAGE:-tracepilot:local}
  env_file: .env
  init: true
  read_only: true
  stop_grace_period: 35s
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  volumes:
    - ${TRACEPILOT_TLS_DIRECTORY:-./data/tls}:/run/tracepilot/tls:ro
  depends_on:
    postgres:
      condition: service_healthy
      required: false

services:
  postgres:
    profiles: [local]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracepilot}
      POSTGRES_USER: ${POSTGRES_USER:-tracepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - ${TRACEPILOT_POSTGRES_PUBLISH:-127.0.0.1:5432:5432}
    volumes:
      - tracepilot-postgres:/var/lib/postgresql/data

  migrate:
    <<: *application
    profiles: [tools]
    command: [migrate, up]
    healthcheck:
      disable: true

  tracepilot:
    <<: *application
    restart: unless-stopped
    ports:
      - ${TRACEPILOT_HTTP_PUBLISH:-127.0.0.1:8080:8080}
      - ${TRACEPILOT_OTLP_GRPC_PUBLISH:-127.0.0.1:4317:4317}
      - ${TRACEPILOT_OTLP_HTTP_PUBLISH:-127.0.0.1:4318:4318}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: [CMD, /tracepilot, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  tracepilot-postgres:
