services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight}
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flight} -d ${POSTGRES_DB:-flight}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - flight-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    image: flight:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLIGHT_DATABASE_URL: ${FLIGHT_DATABASE_URL:-postgres://${POSTGRES_USER:-flight}:${POSTGRES_PASSWORD:-flight-dev-only}@postgres:5432/${POSTGRES_DB:-flight}?sslmode=disable}
    command: ["migrate", "up"]

  flight:
    build: .
    image: flight:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLIGHT_HTTP_ADDRESS: ${FLIGHT_HTTP_ADDRESS:-:8080}
      FLIGHT_LOG_LEVEL: ${FLIGHT_LOG_LEVEL:-info}
      FLIGHT_DATABASE_URL: ${FLIGHT_DATABASE_URL:-postgres://${POSTGRES_USER:-flight}:${POSTGRES_PASSWORD:-flight-dev-only}@postgres:5432/${POSTGRES_DB:-flight}?sslmode=disable}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/flight", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  demo:
    image: flight:dev
    depends_on:
      flight:
        condition: service_healthy
    entrypoint: ["/demo-service"]
    healthcheck:
      disable: true
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://flight:4318/v1/traces}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    ports:
      - "8090:8090"

volumes:
  flight-postgres:
