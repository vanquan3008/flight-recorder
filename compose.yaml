name: tracepilot

services:
  postgres:
    image: postgres:17-alpine
    # Keep the legacy database/user/volume identifiers during the product
    # rename so an existing local volume is not silently replaced.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight}
      POSTGRES_USER: ${POSTGRES_USER:-flight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flight} -d ${POSTGRES_DB:-flight}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - flight-postgres:/var/lib/postgresql/data

  migrate:
    build: ./backend
    image: tracepilot:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:-postgres://${POSTGRES_USER:-flight}:${POSTGRES_PASSWORD:-flight-dev-only}@postgres:5432/${POSTGRES_DB:-flight}?sslmode=disable}
    command: ["migrate", "up"]

  tracepilot:
    build: ./backend
    image: tracepilot:dev
    # Compose uses .env for interpolation only; env_file also passes TracePilot's
    # runtime settings, including authentication, into the container.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_HTTP_ADDRESS: ${TRACEPILOT_HTTP_ADDRESS:-:8080}
      TRACEPILOT_HTTP_ALLOWED_ORIGINS: ${TRACEPILOT_HTTP_ALLOWED_ORIGINS:-}
      TRACEPILOT_LOG_LEVEL: ${TRACEPILOT_LOG_LEVEL:-info}
      TRACEPILOT_PRODUCTION: ${TRACEPILOT_PRODUCTION:-false}
      TRACEPILOT_AUTH_BOOTSTRAP_API_KEY: ${TRACEPILOT_AUTH_BOOTSTRAP_API_KEY:-}
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:-postgres://${POSTGRES_USER:-flight}:${POSTGRES_PASSWORD:-flight-dev-only}@postgres:5432/${POSTGRES_DB:-flight}?sslmode=disable}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/tracepilot", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  flight-postgres:
    # Explicit name keeps the pre-rename volume stable when the checkout
    # directory or Compose project name changes. Override this for an existing
    # volume created under a different Compose project name.
    name: ${TRACEPILOT_POSTGRES_VOLUME_NAME:-flight_flight-postgres}
