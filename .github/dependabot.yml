version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"

updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
