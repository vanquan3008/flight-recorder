version: 2

# One weekly pull request updates every ecosystem together (Go, GitHub Actions, npm, Docker).
# Security updates still arrive as their own pull requests, so they are never held back by the batch.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"

updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  # Workflows live under "/"; the shared composite action needs its own directory.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
