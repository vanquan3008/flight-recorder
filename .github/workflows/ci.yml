name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_DB: tracepilot
  POSTGRES_USER: tracepilot
  POSTGRES_PASSWORD: tracepilot-test
  TRACEPILOT_DATABASE_URL: postgres://tracepilot:tracepilot-test@127.0.0.1:5432/tracepilot?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.0
        with:
          version: "2026.1"
          install-go: false
          working-directory: backend
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          work-dir: backend
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: tracepilot
          POSTGRES_USER: tracepilot
          POSTGRES_PASSWORD: tracepilot-test
        options: >-
          --health-cmd "pg_isready -U tracepilot -d tracepilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Verify PostgreSQL migrations
        run: |
          go -C backend run ./cmd/tracepilot migrate up
          go -C backend run ./cmd/tracepilot migrate down 1
          go -C backend run ./cmd/tracepilot migrate up
      - name: Test
        env:
          TRACEPILOT_INTEGRATION_TEST: "1"
        run: go -C backend test -race -coverprofile=coverage.out ./...
      - name: Compile all packages
        run: go -C backend build ./...
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t tracepilot:ci backend
      - name: Verify image metadata
        run: docker inspect tracepilot:ci --format '{{.Config.User}}' | grep -E '^nonroot(:nonroot)?$'

  smoke:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Verify Compose ingestion and API
        run: make smoke

  ci-success:
    needs: [lint, test, docker, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          check() {
            if [ "$1" != "success" ]; then
              echo "Job result was $1 (expected success)."
              exit 1
            fi
          }
          check "${{ needs.lint.result }}"
          check "${{ needs.test.result }}"
          check "${{ needs.docker.result }}"
          check "${{ needs.smoke.result }}"
