name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_DB: flight
  POSTGRES_USER: flight
  POSTGRES_PASSWORD: flight-test
  FLIGHT_DATABASE_URL: postgres://flight:flight-test@127.0.0.1:5432/flight?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.1"
          install-go: false
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flight
          POSTGRES_USER: flight
          POSTGRES_PASSWORD: flight-test
        options: >-
          --health-cmd "pg_isready -U flight -d flight"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Verify PostgreSQL migrations
        run: |
          go run ./cmd/flight migrate up
          go run ./cmd/flight migrate down 1
          go run ./cmd/flight migrate up
      - name: Test
        env:
          FLIGHT_INTEGRATION_TEST: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: Compile all packages
        run: go build ./...
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.out
          fail_ci_if_error: false

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t flight:ci .
      - name: Verify image metadata
        run: docker inspect flight:ci --format '{{.Config.User}}' | grep -E '^nonroot(:nonroot)?$'

  ci-success:
    needs: [lint, test, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          check() {
            if [ "$1" != "success" ]; then
              echo "Job result was $1 (expected success)."
              exit 1
            fi
          }
          check "${{ needs.lint.result }}"
          check "${{ needs.test.result }}"
          check "${{ needs.docker.result }}"
