name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_DB: tracepilot
  POSTGRES_USER: tracepilot
  POSTGRES_PASSWORD: tracepilot-test
  TRACEPILOT_DATABASE_URL: postgres://tracepilot:tracepilot-test@127.0.0.1:5432/tracepilot?sslmode=disable
  TRACEPILOT_CLICKHOUSE_URL: http://127.0.0.1:8123
  TRACEPILOT_CLICKHOUSE_TEST_URL: http://127.0.0.1:8123

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type check
        run: npm --prefix frontend run check
      - name: Test
        run: npm --prefix frontend run test
      - name: Build console
        run: npm --prefix frontend run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify generated SQLC
        run: make sqlc-check
      - uses: ./.github/actions/setup-go
      - name: Format
        run: make fmt-check
      - name: Source size
        run: make size-check
      - name: Vet
        run: make vet
      - name: Staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
          working-directory: backend
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          work-dir: backend
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: tracepilot
          POSTGRES_USER: tracepilot
          POSTGRES_PASSWORD: tracepilot-test
        options: >-
          --health-cmd "pg_isready -U tracepilot -d tracepilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Verify embedded migrations and schema readiness
        run: |
          go -C backend build -o /tmp/tracepilot ./cmd/tracepilot
          cd /tmp
          /tmp/tracepilot migrate status
          /tmp/tracepilot migrate clickhouse status
          /tmp/tracepilot migrate all
          /tmp/tracepilot migrate all
      - name: Test
        env:
          TRACEPILOT_INTEGRATION_TEST: "1"
          TRACEPILOT_CLICKHOUSE_INTEGRATION_TEST: "1"
        run: go -C backend test -race -coverprofile=coverage.out ./...
      - name: Compile all packages
        run: go -C backend build ./...
      - name: Browser smoke test
        env:
          TRACEPILOT_AUTH_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
          # Browser tests share one IP and repeatedly open sessions and pages.
          TRACEPILOT_HTTP_RATE_LIMIT_AUTH_REQUESTS: "200"
          TRACEPILOT_HTTP_RATE_LIMIT_REQUESTS: "1000"
        run: |
          npm --prefix frontend ci
          npm --prefix frontend exec playwright -- install --with-deps chromium
          go -C backend run ./cmd/tracepilot seed
          go -C backend run ./cmd/tracepilot serve > tracepilot-e2e.log 2>&1 &
          server_pid=$!
          npm --prefix frontend run build
          npm --prefix frontend exec vite -- preview frontend --host 127.0.0.1 --port 4173 --strictPort > frontend-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$server_pid" "$preview_pid"' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null && curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              npm --prefix frontend run test:e2e
              exit 0
            fi
            sleep 1
          done
          cat tracepilot-e2e.log frontend-preview.log
          exit 1
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        continue-on-error: true
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  docker:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: |
          docker build \
            --target server \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t tracepilot:ci backend
      - name: Verify image metadata
        run: docker inspect tracepilot:ci --format '{{.Config.User}}' | grep -E '^nonroot(:nonroot)?$'
      - name: Smoke test image entrypoint
        run: docker run --rm tracepilot:ci version
      - name: Build console image
        run: docker build --target console -t tracepilot-console:ci frontend
      - name: Verify console image
        run: |
          docker inspect tracepilot-console:ci --format '{{.Config.User}}' | grep -E '^nginx(:nginx)?$'
          docker run --rm -e TRACEPILOT_API_UPSTREAM=http://127.0.0.1:8080 tracepilot-console:ci nginx -t

  ci-success:
    needs: [lint, test, frontend, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          check() {
            if [ "$1" != "success" ]; then
              echo "Job result was $1 (expected success)."
              exit 1
            fi
          }
          check "${{ needs.lint.result }}"
          check "${{ needs.test.result }}"
          check "${{ needs.frontend.result }}"
          check "${{ needs.docker.result }}"
