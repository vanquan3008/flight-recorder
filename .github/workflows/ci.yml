name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_DB: tracepilot
  POSTGRES_USER: tracepilot
  POSTGRES_PASSWORD: tracepilot-test
  TRACEPILOT_DATABASE_URL: postgres://tracepilot:tracepilot-test@127.0.0.1:5432/tracepilot?sslmode=disable

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type check
        run: npm --prefix frontend run check
      - name: Test
        run: npm --prefix frontend run test
      - name: Build embedded console
        run: npm --prefix frontend run build
      - name: Verify generated console assets
        run: |
          git diff --exit-code -- backend/internal/webui/dist
          test -z "$(git ls-files --others --exclude-standard -- backend/internal/webui/dist)" || {
            echo "Build produced untracked console assets; commit backend/internal/webui/dist."
            git ls-files --others --exclude-standard -- backend/internal/webui/dist
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify generated SQLC
        run: make sqlc-check
      - name: Verify unified Compose configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $composePath = (Resolve-Path -LiteralPath compose.yaml).Path
          $template = [IO.File]::ReadAllText((Resolve-Path -LiteralPath .env.example).Path)
          $fixtureDirectory = Join-Path ([IO.Path]::GetTempPath()) ('tracepilot-compose-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixtureDirectory | Out-Null
          $fixtureEnv = Join-Path $fixtureDirectory '.env'
          try {
              foreach ($local in @($true, $false)) {
                  $content = $template + [Environment]::NewLine + 'TRACEPILOT_HTTP_RATE_LIMIT_REQUESTS=7'
                  if (-not $local) {
                      $content = $content.Replace('COMPOSE_PROFILES=local', 'COMPOSE_PROFILES=').Replace('TRACEPILOT_PRODUCTION=false', 'TRACEPILOT_PRODUCTION=true').Replace('@postgres:5432/tracepilot?sslmode=disable', '@managed-postgres:5432/tracepilot?sslmode=verify-full')
                  }
                  [IO.File]::WriteAllText($fixtureEnv, $content)
                  $json = docker compose --project-directory $fixtureDirectory --env-file $fixtureEnv -f $composePath config --format json
                  if ($LASTEXITCODE -ne 0) { throw 'Compose model validation failed' }
                  $model = $json | ConvertFrom-Json
                  $services = @($model.services.PSObject.Properties.Name)
                  if (($services -contains 'postgres') -ne $local -or $services -contains 'migrate') { throw 'Profiles started unintended services' }
                  if ($model.services.tracepilot.environment.TRACEPILOT_HTTP_RATE_LIMIT_REQUESTS -ne '7') { throw 'Root env_file was not injected' }
                  $expectedHost = if ($local) { 'postgres' } else { 'managed-postgres' }
                  if (([Uri]$model.services.tracepilot.environment.TRACEPILOT_DATABASE_URL).Host -ne $expectedHost) { throw 'Wrong runtime env file' }
                  $json = docker compose --project-directory $fixtureDirectory --env-file $fixtureEnv -f $composePath --profile tools config --format json
                  if ($LASTEXITCODE -ne 0) { throw 'Migration model validation failed' }
                  $migration = ($json | ConvertFrom-Json).services.migrate
                  if (($migration.command -join ' ') -ne 'migrate up' -or $migration.environment.TRACEPILOT_DATABASE_URL -ne $model.services.tracepilot.environment.TRACEPILOT_DATABASE_URL) { throw 'Migration config differs from application' }
              }
              Write-Output 'Compose checks passed: local/external DB, one-shot migration, root env injection.'
          } finally {
              Remove-Item -LiteralPath $fixtureEnv -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $fixtureDirectory -ErrorAction SilentlyContinue
          }
      - uses: ./.github/actions/setup-go
      - name: Format
        run: make fmt-check
      - name: Source size
        run: make size-check
      - name: Vet
        run: make vet
      - name: Staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
          working-directory: backend
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          work-dir: backend
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: tracepilot
          POSTGRES_USER: tracepilot
          POSTGRES_PASSWORD: tracepilot-test
        options: >-
          --health-cmd "pg_isready -U tracepilot -d tracepilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-go
      - name: Verify PostgreSQL migrations
        run: |
          go -C backend run ./cmd/tracepilot migrate up
          go -C backend run ./cmd/tracepilot migrate down 1
          go -C backend run ./cmd/tracepilot migrate up
      - name: Test
        env:
          TRACEPILOT_INTEGRATION_TEST: "1"
        run: go -C backend test -race -coverprofile=coverage.out ./...
      - name: Compile all packages
        run: go -C backend build ./...
      - name: Browser smoke test
        env:
          TRACEPILOT_AUTH_BOOTSTRAP_API_KEY: tracepilot-development-bootstrap-key-000000
          TRACEPILOT_E2E_API_KEY: tracepilot-development-bootstrap-key-000000
        run: |
          npm --prefix frontend ci
          npm --prefix frontend exec playwright -- install --with-deps chromium
          go -C backend run ./cmd/tracepilot mockdata
          go -C backend run ./cmd/tracepilot serve > tracepilot-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null; then
              npm --prefix frontend run test:e2e
              exit 0
            fi
            sleep 1
          done
          cat tracepilot-e2e.log
          exit 1
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        continue-on-error: true
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  docker:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: |
          docker build \
            --target server \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t tracepilot:ci backend
      - name: Verify image metadata
        run: docker inspect tracepilot:ci --format '{{.Config.User}}' | grep -E '^nonroot(:nonroot)?$'
      - name: Smoke test image entrypoint
        run: docker run --rm tracepilot:ci version

  ci-success:
    needs: [lint, test, frontend, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          check() {
            if [ "$1" != "success" ]; then
              echo "Job result was $1 (expected success)."
              exit 1
            fi
          }
          check "${{ needs.lint.result }}"
          check "${{ needs.test.result }}"
          check "${{ needs.frontend.result }}"
          check "${{ needs.docker.result }}"
