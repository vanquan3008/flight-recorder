name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go

      - name: Resolve version
        id: version
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be semver (example: v0.1.0)."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: |
          tag="${{ steps.version.outputs.tag }}"
          commit="${{ github.sha }}"
          build_time="${{ steps.version.outputs.build_time }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            suffix="${target//\//-}"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go -C backend build -trimpath \
              -ldflags="-s -w -X main.version=${tag} -X main.commit=${commit} -X main.buildTime=${build_time}" \
              -o "../dist/tracepilot-${suffix}" ./cmd/tracepilot
          done

      - name: Smoke test release binary
        run: ./dist/tracepilot-linux-amd64 version

      - name: Generate binary SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/tracepilot-binaries.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum \
            tracepilot-linux-amd64 \
            tracepilot-linux-arm64 \
            tracepilot-binaries.spdx.json > SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract server image metadata
        id: server_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push server image
        id: server_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}

      - name: Extract console image metadata
        id: console_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push console image
        id: console_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: console
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.console_meta.outputs.tags }}
          labels: ${{ steps.console_meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Sign immutable image digest
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign server image with keyless OIDC
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.server_image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Verify server image signature
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.server_image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/" \
            "$IMAGE_DIGEST"

      - name: Sign and verify console image with keyless OIDC
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-console@${{ steps.console_image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/" \
            "$IMAGE_DIGEST"

      - name: Smoke test immutable server image
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.server_image.outputs.digest }}
        run: |
          docker pull "$IMAGE_DIGEST"
          docker run --rm "$IMAGE_DIGEST" version

      - name: Smoke test immutable console image
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-console@${{ steps.console_image.outputs.digest }}
        run: |
          docker pull "$IMAGE_DIGEST"
          docker run --rm -e TRACEPILOT_API_UPSTREAM=http://127.0.0.1:8080 "$IMAGE_DIGEST" nginx -t

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/tracepilot-linux-amd64
            dist/tracepilot-linux-arm64
            dist/SHA256SUMS
            dist/tracepilot-binaries.spdx.json
