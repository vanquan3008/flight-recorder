version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/storage/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        rename:
          api_key: APIKey
          api_key_event: APIKeyEvent
          api_key_id: APIKeyID
          duration_ns: DurationNS
          event_ids: EventIDs
          http_status: HTTPStatus
          resource_schema_url: ResourceSchemaURL
          scope_schema_url: ScopeSchemaURL
          trace_ids: TraceIDs
          url: URL
        overrides:
          # Domain models carry IDs as strings and times as time.Time; pgx
          # encodes and scans both directly, so no pgtype wrappers leak out.
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
