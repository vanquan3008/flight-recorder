name: tracepilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracepilot}
      POSTGRES_USER: ${POSTGRES_USER:-tracepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracepilot-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracepilot} -d ${POSTGRES_DB:-tracepilot}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - tracepilot-postgres:/var/lib/postgresql/data

  migrate:
    build: ../backend
    image: tracepilot:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:-postgres://${POSTGRES_USER:-tracepilot}:${POSTGRES_PASSWORD:-tracepilot-dev-only}@postgres:5432/${POSTGRES_DB:-tracepilot}?sslmode=disable}
    command: ["migrate", "up"]

  tracepilot:
    build: ../backend
    image: tracepilot:dev
    # Compose uses .env for interpolation only; env_file also passes TracePilot
    # runtime settings, including authentication, into the container.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_HTTP_ADDRESS: ${TRACEPILOT_HTTP_ADDRESS:-:8080}
      TRACEPILOT_LOG_LEVEL: ${TRACEPILOT_LOG_LEVEL:-info}
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:-postgres://${POSTGRES_USER:-tracepilot}:${POSTGRES_PASSWORD:-tracepilot-dev-only}@postgres:5432/${POSTGRES_DB:-tracepilot}?sslmode=disable}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/tracepilot", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  tracepilot-postgres:
