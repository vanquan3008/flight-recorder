name: tracepilot

# First production target: one TracePilot replica and a private/managed
# PostgreSQL service. PostgreSQL deliberately is not defined or published here.
services:
  tracepilot:
    image: ${TRACEPILOT_IMAGE:?set an immutable ghcr.io image digest}
    restart: unless-stopped
    read_only: true
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TRACEPILOT_PRODUCTION: "true"
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:?set private PostgreSQL URL}
      TRACEPILOT_AUTH_BOOTSTRAP_API_KEY: ${TRACEPILOT_AUTH_BOOTSTRAP_API_KEY:?set from secret manager}
      TRACEPILOT_HTTP_ADDRESS: ":8080"
      TRACEPILOT_INGESTION_GRPC_ADDRESS: ":4317"
      TRACEPILOT_INGESTION_HTTP_ADDRESS: ":4318"
      TRACEPILOT_SECURITY_ENABLED: ${TRACEPILOT_SECURITY_ENABLED:-false}
      TRACEPILOT_SECURITY_SYSLOG_ADDRESS: ":6514"
      TRACEPILOT_SECURITY_SYSLOG_TLS: ${TRACEPILOT_SECURITY_SYSLOG_TLS:-true}
      TRACEPILOT_SECURITY_SYSLOG_CLIENT_CA_FILE: /run/tracepilot/tls/ca.crt
      TRACEPILOT_NOTIFICATIONS_ENABLED: ${TRACEPILOT_NOTIFICATIONS_ENABLED:-false}
      TRACEPILOT_WEBHOOK_ENCRYPTION_KEY: ${TRACEPILOT_WEBHOOK_ENCRYPTION_KEY:-}
      TRACEPILOT_TLS_CERTIFICATE_FILE: /run/tracepilot/tls/tls.crt
      TRACEPILOT_TLS_PRIVATE_KEY_FILE: /run/tracepilot/tls/tls.key
      TRACEPILOT_HEALTHCHECK_CA_FILE: /run/tracepilot/tls/ca.crt
      TRACEPILOT_HEALTHCHECK_SERVER_NAME: ${TRACEPILOT_HEALTHCHECK_SERVER_NAME:?set TLS certificate DNS name}
      TRACEPILOT_HTTP_ALLOWED_ORIGINS: ${TRACEPILOT_HTTP_ALLOWED_ORIGINS:-}
    volumes:
      - type: bind
        source: ${TRACEPILOT_TLS_DIRECTORY:?set directory containing tls.crt and tls.key}
        target: /run/tracepilot/tls
        read_only: true
    ports:
      - "${TRACEPILOT_HTTP_PUBLISH:-127.0.0.1:8080:8080}"
      - "${TRACEPILOT_OTLP_GRPC_PUBLISH:?set a trusted-network OTLP gRPC bind}"
      - "${TRACEPILOT_OTLP_HTTP_PUBLISH:?set a trusted-network OTLP HTTP bind}"
      - "${TRACEPILOT_SYSLOG_PUBLISH:?set a trusted-network Syslog bind}"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: ["CMD", "/tracepilot", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
