# Disposable test stack for scripts/test-docker.sh. Works with Docker Compose and
# `podman compose`. Every image is fully qualified so rootless Podman needs no
# short-name aliases. Nothing binds to a non-loopback host address.
name: tracepilot-test

x-repo: &repo
  type: bind
  source: ../..
  target: /src
  read_only: true

x-harness: &harness
  type: bind
  source: ./scripts
  target: /harness
  read_only: true

x-results: &results
  type: bind
  source: ../../bin/test-docker
  target: /results

x-backend-image: &backend-image
  image: ${TP_TEST_BACKEND_IMAGE:-localhost/tracepilot-test/backend:latest}
  pull_policy: never
  env_file: ./backend.env
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  postgres:
    image: docker.io/library/postgres:17.12-alpine
    environment:
      POSTGRES_DB: tracepilot_test
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: tracepilot-test-only
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - type: bind
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/10-e2e.sql
        read_only: true
    healthcheck:
      # TCP checks skip the socket-only server the image runs while it initializes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracepilot -d tracepilot_test && psql -h 127.0.0.1 -U tracepilot -d tracepilot_e2e -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.40.7
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 90

  # ---- Static checks and unit/integration tests (profile: checks) ----
  backend-checks:
    profiles: [checks]
    image: docker.io/library/golang:1.26.11-bookworm
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      GOTOOLCHAIN: local
      STATICCHECK: ${TP_TEST_STATICCHECK:-1}
      GO_TEST_FLAGS: ${TP_TEST_GO_TEST_FLAGS:-}
      TRACEPILOT_INTEGRATION_TEST: "1"
      TRACEPILOT_CLICKHOUSE_INTEGRATION_TEST: "1"
      TRACEPILOT_DATABASE_URL: postgres://tracepilot:tracepilot-test-only@postgres:5432/tracepilot_test?sslmode=disable
      TRACEPILOT_CLICKHOUSE_URL: http://clickhouse:8123
      TRACEPILOT_CLICKHOUSE_TEST_URL: http://clickhouse:8123
      TRACEPILOT_CLICKHOUSE_DATABASE: tracepilot_test
      TRACEPILOT_CLICKHOUSE_USERNAME: default
      TRACEPILOT_CLICKHOUSE_PASSWORD: ""
    volumes:
      - *repo
      - *harness
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["bash", "/harness/backend-checks.sh"]

  frontend-checks:
    profiles: [checks]
    image: docker.io/library/node:24.22.3-bookworm-slim
    environment:
      NPM_AUDIT: ${TP_TEST_NPM_AUDIT:-1}
    volumes:
      - *repo
      - *harness
      - npm-cache:/root/.npm
    command: ["bash", "/harness/frontend-checks.sh"]

  # ---- Application stack (profile: stack) ----
  migrate:
    <<: *backend-image
    profiles: [stack]
    command: ["migrate", "all"]
    restart: "no"
    healthcheck:
      disable: true

  admin:
    profiles: [stack]
    image: docker.io/library/golang:1.26.11-bookworm
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ./backend.env
    environment:
      GOTOOLCHAIN: local
    volumes:
      - *repo
      - *harness
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["bash", "/harness/admin.sh"]
    restart: "no"

  tracepilot:
    <<: *backend-image
    profiles: [stack]
    command: ["serve"]
    depends_on:
      admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/tracepilot", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:${TP_TEST_API_PORT:-18080}:8080"
      - "127.0.0.1:${TP_TEST_OTLP_PORT:-18318}:4318"

  console:
    profiles: [stack]
    image: ${TP_TEST_CONSOLE_IMAGE:-localhost/tracepilot-test/console:latest}
    pull_policy: never
    environment:
      TRACEPILOT_API_UPSTREAM: http://tracepilot:8080
    depends_on:
      tracepilot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:${TP_TEST_CONSOLE_PORT:-18081}:8080"

  # ---- Browser tests (profile: e2e) ----
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    depends_on:
      console:
        condition: service_healthy
    shm_size: 1gb
    env_file: ./backend.env
    environment:
      CI: "1"
      TRACEPILOT_E2E_BASE_URL: http://console:8080
      HOST_UID: ${TP_TEST_HOST_UID:-}
      HOST_GID: ${TP_TEST_HOST_GID:-}
    volumes:
      - *repo
      - *harness
      - *results
      - npm-cache:/root/.npm
    command: ["bash", "/harness/e2e.sh"]

  # ---- Load test (profile: load) ----
  loadgen:
    profiles: [load]
    image: docker.io/library/golang:1.26.11-bookworm
    depends_on:
      tracepilot:
        condition: service_healthy
    env_file: ./backend.env
    environment:
      GOTOOLCHAIN: local
      LOAD_SPANS_PER_SECOND: ${TP_TEST_LOAD_SPANS_PER_SECOND:-500}
      LOAD_LOGS_PER_SECOND: ${TP_TEST_LOAD_LOGS_PER_SECOND:-500}
      LOAD_METRIC_POINTS_PER_SECOND: ${TP_TEST_LOAD_METRIC_POINTS_PER_SECOND:-0}
      LOAD_READS_PER_SECOND: ${TP_TEST_LOAD_READS_PER_SECOND:-5}
      LOAD_READ_WINDOW: ${TP_TEST_LOAD_READ_WINDOW:-0s}
      LOAD_DURATION: ${TP_TEST_LOAD_DURATION:-60s}
      LOAD_PROJECTS: ${TP_TEST_LOAD_PROJECTS:-1}
      LOAD_PREFILL: ${TP_TEST_LOAD_PREFILL:-0s}
      LOAD_HISTORY: ${TP_TEST_LOAD_HISTORY:-0s}
      HOST_UID: ${TP_TEST_HOST_UID:-}
      HOST_GID: ${TP_TEST_HOST_GID:-}
    volumes:
      - *repo
      - *harness
      - *results
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["bash", "/harness/loadgen.sh"]

# Caches survive `down -v` because they are external; the script creates them.
volumes:
  go-mod:
    name: tracepilot-test-go-mod
    external: true
  go-build:
    name: tracepilot-test-go-build
    external: true
  npm-cache:
    name: tracepilot-test-npm
    external: true
