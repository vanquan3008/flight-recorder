name: tracepilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - tracepilot-postgres:/var/lib/postgresql/data

  migrate:
    image: ${TRACEPILOT_IMAGE:?set TRACEPILOT_IMAGE to a released image}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:?set TRACEPILOT_DATABASE_URL}
    command: ["migrate", "up"]

  tracepilot:
    image: ${TRACEPILOT_IMAGE:?set TRACEPILOT_IMAGE to a released image}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEPILOT_PRODUCTION: "true"
      TRACEPILOT_DATABASE_URL: ${TRACEPILOT_DATABASE_URL:?set TRACEPILOT_DATABASE_URL}
      TRACEPILOT_AUTH_BOOTSTRAP_API_KEY: ${TRACEPILOT_AUTH_BOOTSTRAP_API_KEY:?set TRACEPILOT_AUTH_BOOTSTRAP_API_KEY}
      TRACEPILOT_TLS_CERTIFICATE_FILE: /run/tls/tls.crt
      TRACEPILOT_TLS_PRIVATE_KEY_FILE: /run/tls/tls.key
      TRACEPILOT_HEALTHCHECK_URL: ${TRACEPILOT_HEALTHCHECK_URL:?set an HTTPS URL covered by the certificate SAN}
      TRACEPILOT_HEALTHCHECK_CA_FILE: ${TRACEPILOT_HEALTHCHECK_CA_FILE:-}
    volumes:
      - type: bind
        source: ${TRACEPILOT_TLS_DIRECTORY:?set TRACEPILOT_TLS_DIRECTORY}
        target: /run/tls
        read_only: true
    ports:
      - "${TRACEPILOT_HTTP_PORT:-8080}:8080"
      - "${TRACEPILOT_OTLP_GRPC_PORT:-4317}:4317"
      - "${TRACEPILOT_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/tracepilot", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  tracepilot-postgres:
